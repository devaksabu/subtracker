name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Locate and Repair Project
        run: |
          # If pubspec.yaml is inside a subfolder, move everything to root
          if [ ! -f "pubspec.yaml" ] && [ -d "subtracker_flutter" ]; then
            echo "Moving files out of subtracker_flutter/ to repo root..."
            shopt -s dotglob
            mv subtracker_flutter/* .
            rmdir subtracker_flutter
          fi

          # Ensure Android scaffolding and gradle wrapper are generated
          flutter create . --platforms=android --org=com.example

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SubTracker-Release-APK
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
